[package]
name = "waveadapter"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["HEnquist <henrik.enquist@gmail.com>"]
description = "Reading and writing wav files into audioadapter buffers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HEnquist/waveadapter"
keywords = ["audio", "wav", "pcm", "sample", "buffer"]
categories = ["multimedia::audio", "multimedia::encoding"]
readme = "README.md"

[dependencies]
num-traits = { version = "0.2.15", default-features = false }
audioadapter = "5.0.0"
audioadapter-sample = "5.1.0"
audioadapter-buffers = "5.0.0"

# TEMPORARY: `U8` needs audioadapter-sample 5.1.0, not yet on crates.io.
# Remove this patch once 5.1.0 is published, a plain `cargo update` is then enough.
[patch.crates-io]
audioadapter-sample = { git = "https://github.com/HEnquist/audioadapter-rs", branch = "add-8bit-formats" }
