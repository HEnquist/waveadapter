[package]
name = "waveadapter"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["HEnquist <henrik.enquist@gmail.com>"]
description = "Reading and writing wav files into audioadapter buffers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HEnquist/waveadapter"
keywords = ["audio", "wav", "pcm", "sample", "buffer"]
categories = ["multimedia::audio", "multimedia::encoding"]
readme = "README.md"

[dependencies]
num-traits = { version = "0.2.15", default-features = false }
audioadapter = "5.0.0"
audioadapter-sample = "5.2.0"
audioadapter-buffers = "5.2.0"

[dev-dependencies]
# Only for the raw path examples, which encode and decode real IMA ADPCM. That
# is a codec, which this crate deliberately does not do itself.
audio-codec-algorithms = "0.8.1"
